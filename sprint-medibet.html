<meta charset="utf-8">
<title>Sprint MediBet</title>
<meta name="description" content="Cas d'usage, équipes et burndown des deux projets MediBet (Patient et Médecin). Le backlog détaillé vit sur Trello.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f6f8fa; --panel:#ffffff; --panel-2:#f0f3f6; --ink:#141b22; --muted:#5b6b78; --faint:#8b99a5;
    --line:#e1e7ec; --line-strong:#c9d3db; --accent:#0e7c72; --accent-ink:#eafaf7; --accent-soft:#e2f3f1;
    --shadow: 0 1px 2px rgba(20,27,34,.04), 0 8px 24px -12px rgba(20,27,34,.12);
    --patient:#3f7cf0; --medecin:#e0537a;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1418; --panel:#161d23; --panel-2:#1c242b; --ink:#e9eef2; --muted:#93a3ae; --faint:#5e6d78;
      --line:#263037; --line-strong:#334049; --accent:#39c2b3; --accent-ink:#07211d; --accent-soft:#123430;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      --patient:#6f9bf5; --medecin:#ef7f9e;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1418; --panel:#161d23; --panel-2:#1c242b; --ink:#e9eef2; --muted:#93a3ae; --faint:#5e6d78;
    --line:#263037; --line-strong:#334049; --accent:#39c2b3; --accent-ink:#07211d; --accent-soft:#123430;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --patient:#6f9bf5; --medecin:#ef7f9e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",-apple-system,Segoe UI,sans-serif;}
  h1,h2,h3{font-family:"IBM Plex Serif",Georgia,serif;text-wrap:balance;margin:0;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
  .tabular{font-variant-numeric:tabular-nums;}
  #app{max-width:1100px;margin:0 auto;padding:28px 20px 70px;}

  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line);}
  .eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:600;}
  .top h1{font-size:26px;margin-top:4px;}
  .top .sub{color:var(--muted);font-size:13.5px;margin-top:4px;}
  .theme-toggle{border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;}

  section{margin-bottom:38px;}
  .section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .section-head h2{font-size:19px;}
  .section-head .hint{color:var(--faint);font-size:12.5px;}

  .trello-note{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:30px;}
  .trello-note a{color:var(--accent);font-weight:600;}

  .uc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
  .uc-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);}
  .uc-card .num{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);}
  .uc-card h3{font-size:14.5px;margin-top:4px;}
  .uc-card p{font-size:13px;color:var(--muted);margin:6px 0 0;line-height:1.5;}
  .uc-card .flow{margin-top:10px;font-size:12px;color:var(--faint);font-family:"IBM Plex Mono",monospace;}

  .proj-tabs{display:flex;gap:8px;margin-bottom:20px;}
  .proj-tab{border:1px solid var(--line-strong);background:var(--panel);color:var(--muted);padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .proj-tab.active.patient{background:var(--patient);border-color:var(--patient);color:#fff;}
  .proj-tab.active.medecin{background:var(--medecin);border-color:var(--medecin);color:#fff;}

  .team-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:20px;}
  .team-card .name{font-weight:700;font-size:14.5px;}
  .team-card .members{margin-top:10px;display:flex;flex-direction:column;gap:7px;}
  .member{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:6px 0;border-top:1px solid var(--line);}
  .member:first-child{border-top:none;}
  .role-tag{font-size:11px;color:var(--muted);background:var(--panel-2);border-radius:6px;padding:2px 7px;}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);}
  .stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
  .stat .value{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:600;margin-top:6px;}
  .stat .value small{font-size:13px;color:var(--muted);font-weight:400;}

  .burn-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow);}
  .burn-legend{display:flex;gap:18px;font-size:12.5px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap;}
  .legend-swatch{display:inline-block;width:16px;height:2px;vertical-align:middle;margin-right:6px;}
  .btn{border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:12px;}
  .btn:hover{border-color:var(--accent);}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .note{font-size:12.5px;color:var(--faint);margin-top:10px;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
  input[type=number]{background:var(--panel-2);border:1px solid var(--line-strong);color:var(--ink);border-radius:8px;padding:7px 10px;font-family:"IBM Plex Mono",monospace;width:90px;}
</style>

<div id="app"></div>

<script>
(function(){
"use strict";

  var SPRINT_DAYS = ["Lundi PM","Mardi AM","Mardi PM","Mercredi AM","Mercredi PM","Jeudi AM"];
  var TRELLO_NOTE_URL = null; // renseigné une fois les boards Trello créés

  var PROJECTS = {
    patient: {
      label:"Projet Patient", color:"patient", engaged:37,
      team:[
        {name:"Neirouz Attia", role:"Product Owner"},
        {name:"Rémi Delarue", role:"Scrum Master"},
        {name:"Romane Cano", role:"Développeuse"}
      ]
    },
    medecin: {
      label:"Projet Médecin", color:"medecin", engaged:52,
      team:[
        {name:"Alexandre Desoutter", role:"Product Owner"},
        {name:"Aimé Goetschel", role:"Scrum Master"},
        {name:"Eya Rejeb", role:"Développeuse"}
      ]
    }
  };

  var USE_CASES = [
    { n:"UC1", title:"Le patient consulte son dossier et mise", desc:"Le patient ouvre un dossier, voit le tableau de cotes par diagnostic possible et place un pronostic avec une mise en CoinPot.", flow:"App Patient → lecture locale des cotes" },
    { n:"UC2", title:"Un proche rejoint le pari à distance", desc:"Le patient partage un code dossier ; un proche (autre appareil) l'utilise pour ajouter sa propre mise au même pari.", flow:"App Patient (poste 2) → pot commun" },
    { n:"UC3", title:"Le médecin consulte le dossier FHIR", desc:"Le médecin ouvre un dossier et lit les données cliniques (Patient, vitaux) exposées par la plateforme FHIR avant de statuer.", flow:"App Médecin → GET /api/patient/{id}" },
    { n:"UC4", title:"Le médecin pose le diagnostic officiel", desc:"Le médecin choisit le diagnostic réel et le publie comme ressource clinique. C'est cet acte qui fait autorité, pas le pari.", flow:"App Médecin → POST /api/observation" },
    { n:"UC5", title:"Le pari se résout via une vraie lecture FHIR", desc:"Depuis un poste différent de celui du médecin, l'app Patient interroge le serveur FHIR pour détecter le diagnostic publié et résoudre le pari.", flow:"App Patient (poste 1) → GET /api/observation?subject.reference=..." },
    { n:"UC6", title:"Le médecin ouvre un booster et enrichit sa collection", desc:"Chaque diagnostic posé rapporte un booster de cartes ; les doublons peuvent être recyclés en solo contre une carte mystère (un seul Médecin dans le jeu, plus d'échange entre collègues).", flow:"App Médecin → atelier de recyclage" },
    { n:"UC7", title:"Le patient récupère son rendez-vous de suivi", desc:"Après un pari gagné, le patient déclenche la prise d'un rendez-vous de suivi auprès de la plateforme FHIR.", flow:"App Patient → POST /api/appointment" }
  ];

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  var db = null;
  var snapshots = { patient:{}, medecin:{} };
  var activeProject = "patient";

  function render(){
    var app = document.getElementById("app");
    app.innerHTML = topBar() + useCasesSection() + projectSection();
    wire();
  }

  function topBar(){
    return '<div class="top">'+
      '<div><div class="eyebrow">Analyse métier &amp; pilotage · MediBet</div><h1>Cas d\'usage, équipes &amp; burndown</h1>'+
      '<div class="sub">Deux projets Scrum distincts (Patient / Médecin), sprint du '+SPRINT_DAYS[0]+' au '+SPRINT_DAYS[SPRINT_DAYS.length-1]+'.</div></div>'+
      '<button class="theme-toggle" id="btnTheme">🌓 Thème</button>'+
    '</div>'+
    '<div class="trello-note">📋 <span>Product backlog détaillé (user stories, priorités, statuts) tenu à jour sur <b>Trello</b>, un board par équipe. Cette page couvre l\'analyse métier et le suivi d\'avancement (burndown).</span></div>';
  }

  function useCasesSection(){
    return '<section><div class="section-head"><h2>Cas d\'usage (analyse métier)</h2><span class="hint">'+USE_CASES.length+' scénarios</span></div>'+
      '<div class="uc-grid">'+
      USE_CASES.map(function(u){
        return '<div class="uc-card"><div class="num">'+u.n+'</div><h3>'+esc(u.title)+'</h3><p>'+esc(u.desc)+'</p><div class="flow">'+esc(u.flow)+'</div></div>';
      }).join("")+
      '</div></section>';
  }

  function projectSection(){
    var p = PROJECTS[activeProject];
    var snaps = Object.keys(snapshots[activeProject]).map(function(k){return snapshots[activeProject][k];}).sort(function(a,b){return a.dayIndex-b.dayIndex;});
    var done = snaps.length ? Math.max(0, p.engaged - snaps[snaps.length-1].remaining) : 0;
    var remaining = p.engaged - done;
    var daysElapsed = snaps.length;
    var velocity = daysElapsed ? (done/daysElapsed).toFixed(1) : "—";
    var predictability = p.engaged ? Math.round((done/p.engaged)*100) : 0;

    return '<section><div class="section-head"><h2>Suivi d\'avancement</h2></div>'+
      '<div class="proj-tabs">'+
        Object.keys(PROJECTS).map(function(k){
          return '<button class="proj-tab '+(k===activeProject?"active "+PROJECTS[k].color:"")+'" data-proj="'+k+'">'+PROJECTS[k].label+'</button>';
        }).join("")+
      '</div>'+
      '<div class="team-card"><div class="name">'+p.label+'</div><div class="members">'+
        p.team.map(function(m){ return '<div class="member"><span>'+esc(m.name)+'</span><span class="role-tag">'+esc(m.role)+'</span></div>'; }).join("")+
      '</div></div>'+
      '<div class="stat-row">'+
        stat("Points engagés", p.engaged, "")+
        stat("Points terminés", done, "/ "+p.engaged)+
        stat("Reste à faire", remaining, "pts")+
        stat("Vélocité", velocity, daysElapsed?"pts/j":"")+
        stat("Prédictabilité", predictability, "%")+
      '</div>'+
      burndown(p, snaps, remaining)+
    '</section>';
  }
  function stat(label, value, suffix){
    return '<div class="stat"><div class="label">'+label+'</div><div class="value tabular">'+value+' <small>'+suffix+'</small></div></div>';
  }

  function burndown(p, snapList, remainingNow){
    var w=860,h=270,pad={l:44,r:20,t:16,b:34};
    var n = SPRINT_DAYS.length;
    var xStep = (w-pad.l-pad.r)/n;
    function x(i){ return pad.l + i*xStep; }
    function y(v){ return pad.t + (1-(v/p.engaged))*(h-pad.t-pad.b); }

    var idealPts = []; for(var i=0;i<=n;i++){ idealPts.push([x(i), y(p.engaged - (p.engaged/n)*i)]); }
    var idealPath = idealPts.map(function(pt,i){ return (i===0?"M":"L")+pt[0].toFixed(1)+","+pt[1].toFixed(1); }).join(" ");

    var actualPts = [[x(0), y(p.engaged)]];
    snapList.forEach(function(s){ actualPts.push([x(s.dayIndex+1), y(s.remaining)]); });
    var actualPath = actualPts.length>1 ? actualPts.map(function(pt,i){ return (i===0?"M":"L")+pt[0].toFixed(1)+","+pt[1].toFixed(1); }).join(" ") : "";

    var todayIndex = snapList.length;
    var canLog = todayIndex < n;
    var gridLines = "";
    for(var gy=0; gy<=4; gy++){
      var val = p.engaged - (p.engaged/4)*gy;
      var yy = y(val);
      gridLines += '<line x1="'+pad.l+'" y1="'+yy.toFixed(1)+'" x2="'+(w-pad.r)+'" y2="'+yy.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
      gridLines += '<text x="'+(pad.l-8)+'" y="'+(yy+4).toFixed(1)+'" font-size="11" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono, monospace">'+Math.round(val)+'</text>';
    }
    var xLabels = "";
    for(var xi=0; xi<n; xi++){
      xLabels += '<text x="'+(x(xi)+xStep/2).toFixed(1)+'" y="'+(h-10)+'" font-size="10.5" text-anchor="middle" fill="var(--muted)">'+SPRINT_DAYS[xi]+'</text>';
    }

    return '<div class="burn-wrap">'+
        '<div class="burn-legend"><span><span class="legend-swatch" style="border-top:2px dashed var(--faint);"></span>Idéal</span>'+
        '<span><span class="legend-swatch" style="background:var(--'+p.color+');"></span>Réel</span></div>'+
        '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;">'+
          gridLines+xLabels+
          '<path d="'+idealPath+'" fill="none" stroke="var(--faint)" stroke-width="2" stroke-dasharray="6 5"/>'+
          (actualPath ? '<path d="'+actualPath+'" fill="none" stroke="var(--'+p.color+')" stroke-width="2.5"/>' : "")+
          actualPts.map(function(pt){ return '<circle cx="'+pt[0].toFixed(1)+'" cy="'+pt[1].toFixed(1)+'" r="4" fill="var(--'+p.color+')"/>'; }).join("")+
        '</svg>'+
        (canLog ?
          '<div><input type="number" id="inpRemaining" value="'+remainingNow+'" min="0" max="'+p.engaged+'"> pts restants aujourd\'hui, '+
          '<button class="btn btn-accent" id="btnLogDay">Enregistrer « '+SPRINT_DAYS[todayIndex]+' »</button></div>'
          : '<div class="note">Tous les relevés du sprint sont enregistrés.</div>')+
        '<div class="note">Un relevé = le total des points restants dans le board Trello de ce projet, à faire ensemble une fois par demi-journée.</div>'+
      '</div>';
  }

  function wire(){
    var themeBtn = document.getElementById("btnTheme");
    if(themeBtn) themeBtn.onclick = function(){
      var root = document.documentElement;
      var cur = root.getAttribute("data-theme");
      var next = cur==="dark" ? "light" : (cur==="light" ? null : "dark");
      if(next) root.setAttribute("data-theme", next); else root.removeAttribute("data-theme");
    };
    document.querySelectorAll(".proj-tab").forEach(function(el){
      el.onclick = function(){ activeProject = el.getAttribute("data-proj"); render(); };
    });
    var logBtn = document.getElementById("btnLogDay");
    if(logBtn) logBtn.onclick = function(){
      var val = parseInt(document.getElementById("inpRemaining").value, 10);
      if(isNaN(val)) return;
      var dayIndex = Object.keys(snapshots[activeProject]).length;
      var doc = { dayIndex:dayIndex, day:SPRINT_DAYS[dayIndex], remaining:val, t:Date.now() };
      if(db) db.doc("snapshots_"+activeProject+"/day-"+dayIndex).set(doc);
      else { snapshots[activeProject]["day-"+dayIndex] = doc; render(); }
    };
  }

  render();

  if(window.claude && window.claude.use){
    window.claude.use("db").then(function(d){
      db = d;
      if(!db) return;
      ["patient","medecin"].forEach(function(key){
        db.collection("snapshots_"+key).onSnapshot(function(snap){
          snapshots[key] = {};
          snap.docs.forEach(function(doc){ snapshots[key][doc.id] = doc.data(); });
          render();
        }, function(){});
      });
    });
  }

})();
</script>
