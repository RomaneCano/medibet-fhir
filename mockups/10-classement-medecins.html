<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MediBet — Classement des collègues (médecins)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg:#0a0d12; --panel:#121722; --panel2:#182031;
      --ink:#eef3f7; --muted:#8ea0b5; --faint:#5b6c82; --gold:#ffb400;
      --line:#243149; --line-soft:#1a2334; --shadow:0 20px 50px -20px rgba(0,0,0,.7);
    }
    *{box-sizing:border-box;}
    html,body{margin:0;}
    body{background:radial-gradient(1200px 700px at 50% -10%, #1a2540 0%, transparent 60%), var(--bg);color:var(--ink);font-family:"IBM Plex Sans",-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;}
    .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
    .frame{width:900px;min-height:760px;}
    .marquee{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 40px 14px;border-bottom:1px solid var(--line-soft);}
    .brand{display:flex;align-items:baseline;gap:10px;}
    .brand .logo{font-family:"Monoton",cursive;font-size:26px;letter-spacing:2px;color:var(--gold);text-shadow:0 0 6px rgba(255,180,0,.55);}
    .brand .tag{font-size:10.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;}
    .btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:600;}
    main{max-width:760px;margin:0 auto;padding:28px 40px 60px;}
    h1{font-size:24px;margin:0;}
    .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 16px;}
    .note{font-size:12.5px;color:var(--faint);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;background:var(--panel2);margin-bottom:18px;}
    .card{background:var(--panel);border:1px solid var(--line-soft);border-radius:16px;padding:20px;box-shadow:var(--shadow);}
    .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;}
    .avatar{width:34px;height:34px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;}
    .pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);}
    .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
  </style>
</head>
<body>
<div class="frame">
  <div class="marquee">
    <div class="brand"><span class="logo">MediBet</span><span class="tag">le jackpot du diagnostic</span></div>
    <button class="btn">← Retour</button>
  </div>
  <main>
    <div class="section-head"><h1>Classement des collègues</h1></div>
    <div class="note">Sur demande du professeur, le jeu n'a qu'un seul Médecin (Alexandre Desoutter) — ce tableau reste prévu pour plusieurs praticiens si le jeu s'ouvre à d'autres comptes.</div>
    <div class="card">
      <div class="row">
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="avatar">🩺</div>
          <div><b>Alexandre Desoutter</b><div class="faint mono" style="font-size:12px;color:var(--faint);">7 diagnostics posés</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="pill">23 cartes</span>
          <span class="pill">✨ 2 rares+</span>
          <button class="btn btn-sm">Voir</button>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
