<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MediBet — Proche — rejoindre un pari</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg:#0a0d12; --panel:#121722; --panel2:#182031;
      --ink:#eef3f7; --muted:#8ea0b5; --gold:#ffb400;
      --line:#243149; --line-soft:#1a2334; --shadow:0 20px 50px -20px rgba(0,0,0,.7);
    }
    *{box-sizing:border-box;}
    html,body{margin:0;}
    body{background:radial-gradient(1200px 700px at 50% -10%, #1a2540 0%, transparent 60%), var(--bg);color:var(--ink);font-family:"IBM Plex Sans",-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;}
    .frame{width:900px;min-height:700px;}
    .marquee{display:flex;align-items:center;gap:16px;padding:22px 40px 14px;border-bottom:1px solid var(--line-soft);}
    .brand{display:flex;align-items:baseline;gap:10px;}
    .brand .logo{font-family:"Monoton",cursive;font-size:26px;letter-spacing:2px;color:var(--gold);text-shadow:0 0 6px rgba(255,180,0,.55);}
    .brand .tag{font-size:10.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;}
    main{display:flex;justify-content:center;padding:80px 40px;}
    .card{background:var(--panel);border:1px solid var(--line-soft);border-radius:16px;padding:28px;box-shadow:var(--shadow);width:440px;}
    h2{font-size:19px;margin:0 0 6px;}
    .muted{color:var(--muted);font-size:14px;margin:0;}
    .btn-row{display:flex;gap:8px;margin-top:16px;}
    input[type=text]{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px;font-family:"IBM Plex Mono",monospace;}
    .btn-gold{background:linear-gradient(180deg,#ffcc4d,#ffa500);color:#3a2600;border:none;box-shadow:0 8px 20px -8px rgba(255,180,0,.6);padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:700;}
  </style>
</head>
<body>
<div class="frame">
  <div class="marquee">
    <div class="brand"><span class="logo">MediBet</span><span class="tag">le jackpot du diagnostic</span></div>
  </div>
  <main>
    <div class="card">
      <h2>Rejoindre un pari</h2>
      <p class="muted">Entre le code dossier que ton proche t'a envoyé.</p>
      <div class="btn-row">
        <input type="text" placeholder="dossier-abc123">
        <button class="btn-gold">Voir le pari</button>
      </div>
    </div>
  </main>
</div>
</body>
</html>
