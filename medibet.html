<meta charset="utf-8">
<title>MediBet</title>
<meta name="description" content="Le jackpot du diagnostic : les patients misent sur leur maladie, les médecins tranchent et ouvrent des boosters.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#0a0d12;
    --panel:#121722;
    --panel2:#182031;
    --raised:#1d273b;
    --ink:#eef3f7;
    --muted:#8ea0b5;
    --faint:#5b6c82;
    --gold:#ffb400;
    --gold-ink:#3a2600;
    --crimson:#ff4d5e;
    --mint:#34e2a1;
    --violet:#b98bff;
    --line:#243149;
    --line-soft:#1a2334;
    --shadow: 0 20px 50px -20px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:
      radial-gradient(1200px 700px at 50% -10%, #1a2540 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--gold);color:var(--gold-ink);}
  a{color:var(--gold);}
  button{font-family:inherit;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
  .tabular{font-variant-numeric:tabular-nums;}

  /* ---------- shell ---------- */
  #app{max-width:1180px;margin:0 auto;padding:0 20px 60px;}

  .marquee{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(180deg, #0d121b 0%, #0d121bee 80%, transparent);
    padding:18px 0 10px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--line-soft);
    backdrop-filter:blur(6px);
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .logo{
    font-family:"Monoton",cursive;
    font-size:30px;letter-spacing:2px;
    color:var(--gold);
    text-shadow:0 0 6px rgba(255,180,0,.55), 0 0 22px rgba(255,180,0,.25);
  }
  .brand .tag{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;}
  .marquee-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--panel2);border:1px solid var(--line);
    border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);
  }
  .pill b{color:var(--ink);font-weight:600;}
  .btn{
    appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
    padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .btn:hover{border-color:var(--gold);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn-gold{background:linear-gradient(180deg,#ffcc4d,#ffa500);color:#3a2600;border:none;box-shadow:0 8px 20px -8px rgba(255,180,0,.6);}
  .btn-gold:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;}
  .btn-danger{border-color:rgba(255,77,94,.4);color:var(--crimson);}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  main{padding-top:26px;}
  h1,h2,h3{text-wrap:balance;margin:0 0 4px;}
  h1{font-size:26px;}
  h2{font-size:19px;}
  h3{font-size:15px;}
  .muted{color:var(--muted);}
  .faint{color:var(--faint);}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px;flex-wrap:wrap;}
  .section-head:first-child{margin-top:0;}

  .card{
    background:var(--panel);border:1px solid var(--line-soft);border-radius:16px;
    padding:20px;box-shadow:var(--shadow);
  }
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
  .grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}

  /* ---------- landing ---------- */
  .landing{display:grid;place-items:center;min-height:70vh;text-align:center;}
  .landing .logo-big{
    font-family:"Monoton",cursive;font-size:clamp(42px,9vw,84px);
    color:var(--gold);text-shadow:0 0 10px rgba(255,180,0,.55), 0 0 40px rgba(255,180,0,.3);
    margin-bottom:6px; animation:flicker 4s infinite;
  }
  @keyframes flicker{
    0%,100%{opacity:1;} 92%{opacity:1;} 93%{opacity:.6;} 94%{opacity:1;} 96%{opacity:.75;} 97%{opacity:1;}
  }
  .landing p.sub{color:var(--muted);font-size:15px;max-width:520px;margin:0 auto 30px;}
  .role-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;max-width:760px;width:100%;}
  .role-card{
    background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:26px 20px;cursor:pointer;
    transition:.15s ease; text-align:left;
  }
  .role-card:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 14px 30px -14px rgba(255,180,0,.35);}
  .role-card .emoji{font-size:34px;}
  .role-card h3{margin-top:10px;font-size:17px;}
  .role-card p{color:var(--muted);font-size:13px;margin:6px 0 0;}

  .roster{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;}
  .name-chip{
    border:1px solid var(--line);background:var(--panel2);color:var(--ink);
    padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:500;
  }
  .name-chip:hover{border-color:var(--gold);}
  .name-chip.active{border-color:var(--gold);background:rgba(255,180,0,.12);}

  /* ---------- dossier / betting board ---------- */
  .dossier{
    background:var(--panel);border:1px solid var(--line-soft);border-radius:16px;overflow:hidden;
  }
  .dossier-top{padding:18px 20px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line-soft);}
  .dossier-id{font-size:11px;color:var(--faint);}
  .status-tag{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
  .status-ouvert{background:rgba(52,226,161,.12);color:var(--mint);border:1px solid rgba(52,226,161,.3);}
  .status-resolu{background:rgba(139,148,255,.12);color:var(--violet);border:1px solid rgba(185,139,255,.3);}
  .vitals{display:flex;gap:18px;flex-wrap:wrap;padding:14px 20px;font-size:13px;color:var(--muted);background:var(--panel2);}
  .vitals b{color:var(--ink);}
  .odds-board{padding:10px 14px;display:flex;flex-direction:column;gap:0;}
  .odds-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 8px;border-bottom:1px dashed var(--line-soft);
  }
  .odds-row:last-child{border-bottom:none;}
  .odds-name{font-weight:600;font-size:14.5px;}
  .odds-cote{
    font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:17px;color:var(--gold);
    background:rgba(255,180,0,.08);border:1px solid rgba(255,180,0,.25);border-radius:8px;
    padding:4px 10px;min-width:64px;text-align:center;
  }
  .odds-row.picked{background:rgba(255,180,0,.06);border-radius:10px;}
  .odds-row.winner{background:rgba(52,226,161,.08);}
  .odds-row.loser{opacity:.55;}

  .stake-row{display:flex;gap:10px;align-items:center;padding:16px 20px;background:var(--panel2);flex-wrap:wrap;}
  .symptom-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}
  .symptom-chip{
    border:1px solid var(--line);background:var(--panel2);color:var(--ink);
    padding:10px 16px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:500;
    transition:.12s ease;
  }
  .symptom-chip:hover{border-color:var(--gold);}
  .symptom-chip.on{background:rgba(255,180,0,.14);border-color:var(--gold);color:var(--gold);font-weight:700;}
  select optgroup{color:var(--gold);font-weight:700;background:var(--bg);}
  select option{color:var(--ink);background:var(--bg);}
  input[type=number], input[type=text]{
    background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;
    padding:9px 11px;font-size:14px;font-family:"IBM Plex Mono",monospace;
  }
  .mise-list{padding:12px 20px;display:flex;flex-direction:column;gap:6px;}
  .mise-item{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:4px 0;border-bottom:1px solid var(--line-soft);}
  .mise-item b{color:var(--ink);}
  .pot-total{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line-soft);}

  .result-banner{padding:16px 20px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;}
  .result-win{color:var(--mint);}
  .result-lose{color:var(--crimson);}

  /* ---------- booster / cards ---------- */
  .pack-cta{
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
    padding:40px 20px;text-align:center;
  }
  .pack-art{
    width:120px;height:160px;border-radius:14px;
    background:linear-gradient(145deg,#2a1a4d,#5b2fa8 40%,#ffb400 140%);
    box-shadow:0 20px 45px -18px rgba(255,180,0,.5), inset 0 0 0 2px rgba(255,255,255,.15);
    display:grid;place-items:center;font-size:38px;cursor:pointer;
    animation:float 3.2s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}

  .rarity-COMMUN{--rc:#8ea0b5;}
  .rarity-RARE{--rc:#4da3ff;}
  .rarity-EPIQUE{--rc:#b98bff;}
  .rarity-LEGENDAIRE{--rc:#ffb400;}
  .rarity-MYTHIQUE{--rc:#ff4d5e;}

  .card-tile{
    border-radius:14px;border:1px solid var(--line);background:var(--panel2);
    padding:14px;text-align:center;position:relative;overflow:hidden;
  }
  .card-tile .glow{position:absolute;inset:-40%;background:radial-gradient(circle,var(--rc) 0%,transparent 65%);opacity:.18;pointer-events:none;}
  .card-tile .emoji{font-size:36px;display:block;margin-bottom:8px;filter:drop-shadow(0 0 8px var(--rc));}
  .card-tile .name{font-weight:700;font-size:13px;}
  .card-tile .rarity{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--rc);font-weight:700;margin-top:4px;}
  .card-tile .count{position:absolute;top:8px;right:10px;font-size:11px;color:var(--muted);font-family:"IBM Plex Mono",monospace;}
  .card-tile.owned-0{opacity:.28;filter:grayscale(1);}

  .reveal-overlay{
    position:fixed;inset:0;background:rgba(4,6,10,.86);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:22px;
  }
  .reveal-cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:640px;}
  .reveal-card{
    width:140px;padding:18px 10px;border-radius:16px;background:var(--panel);
    border:2px solid var(--rc);text-align:center;
    box-shadow:0 0 30px -6px var(--rc);
    animation:pop .5s cubic-bezier(.2,1.5,.4,1) both;
  }
  @keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .reveal-card .emoji{font-size:46px;}
  .reveal-card .name{font-weight:700;font-size:13.5px;margin-top:8px;}
  .reveal-card .rarity{font-size:10.5px;color:var(--rc);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-top:4px;}

  /* ---------- trades / colleagues ---------- */
  .medecin-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line-soft);}
  .medecin-row:last-child{border-bottom:none;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;}

  .trade-item{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
  select{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13.5px;}

  /* ---------- fhir console ---------- */
  .fhir-toggle{
    position:fixed;bottom:18px;right:18px;z-index:60;
    background:var(--panel2);border:1px solid var(--line);color:var(--mint);
    border-radius:999px;padding:10px 16px;font-size:12.5px;font-family:"IBM Plex Mono",monospace;
    cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;
  }
  .fhir-dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint);animation:blink 1.6s infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
  .fhir-console{
    position:fixed;bottom:0;left:0;right:0;height:280px;background:#070a0f;border-top:1px solid var(--line);
    z-index:59;transform:translateY(100%);transition:transform .25s ease;
    display:flex;flex-direction:column;
  }
  .fhir-console.open{transform:translateY(0);}
  .fhir-console-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line-soft);}
  .fhir-console-head .title{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--mint);}
  .fhir-log{flex:1;overflow-y:auto;padding:10px 16px;font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.65;}
  .fhir-log .l{margin-bottom:9px;white-space:pre-wrap;word-break:break-all;}
  .fhir-log .m{color:var(--gold);}
  .fhir-log .p{color:var(--muted);}
  .fhir-log .r{color:var(--faint);padding-left:14px;}

  .note{
    font-size:12.5px;color:var(--faint);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;
    background:var(--panel2);
  }
  .empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:14px;}
  .kbd{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-family:"IBM Plex Mono",monospace;font-size:12px;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
</style>

<div id="app"></div>
<button class="fhir-toggle" id="fhirToggle"><span class="fhir-dot"></span> FHIR trace</button>
<div class="fhir-console" id="fhirConsole">
  <div class="fhir-console-head">
    <span class="title" id="fhirConsoleTitle">// api.alliance4u.io · flux FHIR</span>
    <button class="btn btn-sm btn-ghost" id="fhirClose">Fermer ✕</button>
  </div>
  <div class="fhir-log" id="fhirLog"></div>
</div>
<div id="overlayRoot"></div>

<script>
(function(){
"use strict";

/* =========================================================================
   CONFIG. Pointeur vers la vraie plateforme d'intermédiation FHIR du TP.
   Cet artifact tourne dans le bac à sable de Claude (CSP), qui bloque les
   appels réseau vers des hôtes externes arbitraires : sur cette page publiée
   en artifact, les appels FHIR tournent donc en mode simulé. Sur medibet-fhir.netlify.app
   (site public, hors bac à sable), FHIR_BASE est un vrai hôte externe atteint par un vrai
   fetch() : vérifié en direct, l'API du TP répond, autorise le cross-origin (CORS ouvert)
   et les 6 patients / 3 practitioners ci-dessous existent réellement dessus. Le module
   fhirClient respecte EXACTEMENT les routes/méthodes de la doc (POST /api/{resource},
   GET /api/{resource}/{id}, GET /api/{resource}?filtre, PUT, DELETE) et journalise chaque
   appel dans la console FHIR en bas de page. MOCK_MODE ne sert plus qu'à rejouer une démo
   hors ligne ou dans l'artifact Claude.
   ========================================================================= */
  var FHIR_BASE = "https://fhir.alliance4u.io";
  var MOCK_MODE = !!(window.claude && window.claude.use);

  var TEAMS = {
    patient: { label: "Équipe Patient", members: ["Romane Cano","Rémi Delarue","Neirouz Attia"] },
    medecin: { label: "Équipe Médecin", members: ["Alexandre Desoutter","Aimé Goetschel","Eya Rejeb"] }
  };
  var PRACTITIONER_IDS = {
    "Alexandre Desoutter": "6a9eb9f82788f33b659d11ef",
    "Aimé Goetschel": "6a9eb9f92788f33b659d11f0",
    "Eya Rejeb": "6a9eb9f92788f33b659d11f1"
  };

  /* ---------------- symptômes & base de connaissance maladies ----------------
     Le patient coche ses symptômes ; notre algorithme d'aide au pré-diagnostic
     croise ces symptômes avec la base ci-dessous pour proposer les diagnostics
     les plus probables (avec une cote). Le médecin, lui, choisit dans la base
     complète — bien plus large que les seules suggestions faites au patient. */
  var SYMPTOMS = [
    {id:"fievre", label:"Fièvre", emoji:"🌡️"},
    {id:"toux", label:"Toux", emoji:"😷"},
    {id:"mal_gorge", label:"Mal de gorge", emoji:"🗣️"},
    {id:"fatigue", label:"Fatigue", emoji:"😴"},
    {id:"cephalees", label:"Céphalées", emoji:"🤕"},
    {id:"dlr_thorax", label:"Douleur thoracique", emoji:"🫀"},
    {id:"dlr_abdo", label:"Douleur abdominale", emoji:"🤢"},
    {id:"nausees", label:"Nausées", emoji:"🤮"},
    {id:"vomissements", label:"Vomissements", emoji:"🤢"},
    {id:"diarrhee", label:"Diarrhée", emoji:"💩"},
    {id:"eruption", label:"Éruption cutanée", emoji:"🔴"},
    {id:"demangeaisons", label:"Démangeaisons", emoji:"✋"},
    {id:"dlr_articulaire", label:"Douleur articulaire", emoji:"🦴"},
    {id:"dlr_musculaire", label:"Douleur musculaire", emoji:"💪"},
    {id:"essoufflement", label:"Essoufflement", emoji:"🫁"},
    {id:"vertiges", label:"Vertiges", emoji:"😵"},
    {id:"perte_appetit", label:"Perte d'appétit", emoji:"🍽️"},
    {id:"frissons", label:"Frissons", emoji:"🥶"},
    {id:"ganglions", label:"Ganglions gonflés", emoji:"🔵"},
    {id:"yeux_rouges", label:"Yeux rouges", emoji:"👁️"},
    {id:"nez_qui_coule", label:"Nez qui coule", emoji:"🤧"},
    {id:"dlr_lombaire", label:"Douleur lombaire", emoji:"🔻"},
    {id:"palpitations", label:"Palpitations", emoji:"💓"},
    {id:"confusion", label:"Confusion", emoji:"😶‍🌫️"},
    {id:"perte_poids", label:"Perte de poids", emoji:"⚖️"}
  ];
  var SYMPTOM_LABEL = {}; SYMPTOMS.forEach(function(s){ SYMPTOM_LABEL[s.id]=s.label; });

  var DISEASES = [
    // ORL / Respiratoire
    {id:"rhino", label:"Rhino-pharyngite virale", cat:"ORL / Respiratoire", s:{nez_qui_coule:1,toux:.6,mal_gorge:.5,fievre:.3}},
    {id:"angine-v", label:"Angine virale", cat:"ORL / Respiratoire", s:{mal_gorge:1,fievre:.6,ganglions:.4}},
    {id:"angine-b", label:"Angine bactérienne (SGA)", cat:"ORL / Respiratoire", s:{mal_gorge:1,fievre:.8,ganglions:.7,frissons:.3}},
    {id:"mono", label:"Mononucléose infectieuse", cat:"ORL / Respiratoire", s:{fatigue:1,ganglions:.9,mal_gorge:.6,fievre:.5}},
    {id:"grippe", label:"Grippe saisonnière", cat:"ORL / Respiratoire", s:{fievre:1,frissons:.8,dlr_musculaire:.7,fatigue:.7,toux:.5}},
    {id:"bronchite", label:"Bronchite aiguë", cat:"ORL / Respiratoire", s:{toux:1,essoufflement:.4,fievre:.3,fatigue:.3}},
    {id:"sinusite", label:"Sinusite", cat:"ORL / Respiratoire", s:{cephalees:.8,nez_qui_coule:.7,fievre:.3}},
    {id:"pneumonie", label:"Pneumonie", cat:"ORL / Respiratoire", s:{fievre:1,toux:.9,essoufflement:.8,dlr_thorax:.5,frissons:.5}},
    {id:"viral-resp", label:"Syndrome viral respiratoire", cat:"ORL / Respiratoire", s:{fievre:.7,toux:.7,fatigue:.8,perte_appetit:.3,cephalees:.4}},
    {id:"otite", label:"Otite", cat:"ORL / Respiratoire", s:{fievre:.5,cephalees:.3,fatigue:.2}},
    // Digestif
    {id:"gastro", label:"Gastro-entérite aiguë", cat:"Digestif", s:{vomissements:1,diarrhee:1,nausees:.8,fievre:.3,dlr_abdo:.5}},
    {id:"appendicite", label:"Appendicite", cat:"Digestif", s:{dlr_abdo:1,nausees:.6,fievre:.5,perte_appetit:.5}},
    {id:"rgo", label:"Reflux gastro-œsophagien", cat:"Digestif", s:{dlr_thorax:.5,dlr_abdo:.5,nausees:.3}},

  var DISEASE_BY_ID = {}; DISEASES.forEach(function(d){ DISEASE_BY_ID[d.id]=d; });
  var DISEASE_CATEGORIES = []; DISEASES.forEach(function(d){ if(DISEASE_CATEGORIES.indexOf(d.cat)===-1) DISEASE_CATEGORIES.push(d.cat); });

  function diseaseLabel(code){ var d=DISEASE_BY_ID[code]; return d?d.label:code; }

  /* Notre "algorithme IA" de pré-diagnostic : score chaque maladie de la base
     selon le recouvrement avec les symptômes cochés par le patient, garde les
     5 plus probables et leur attribue une cote inversement liée à leur rang
     (favori proche de 1, outsiders à deux chiffres) — un vrai tableau de paris. */
  var COTE_LADDER = [1.5, 2.8, 5.0, 9.0, 16.0];
  function computeProbableDiagnoses(symptomIds){
    var picked = {}; symptomIds.forEach(function(id){ picked[id]=true; });
    var scored = DISEASES.map(function(d){
      var score = 0, maxScore = 0;
      Object.keys(d.s).forEach(function(sym){
        maxScore += d.s[sym];
        if(picked[sym]) score += d.s[sym];
      });
      return { d:d, score: maxScore>0 ? score/maxScore : 0, hits: Object.keys(d.s).filter(function(s){return picked[s];}).length };
    }).filter(function(x){ return x.hits>0; })
      .sort(function(a,b){ return b.score-a.score || b.hits-a.hits; });
    var top = scored.slice(0,5);
    if(top.length===0){
      // aucun symptôme reconnu : on retombe sur des diagnostics bénins génériques
      top = [DISEASE_BY_ID.rhino, DISEASE_BY_ID.gastro, DISEASE_BY_ID.tension].filter(Boolean).map(function(d){return {d:d,score:.2};});
    }
    var topScore = top[0].score || 1;
    return top.map(function(x,i){
      var jitter = Math.pow((topScore+.05)/(x.score+.05), .3);
      var cote = Math.max(1.15, Math.min(30, (COTE_LADDER[i]||20) * jitter));
      return { code:x.d.id, label:x.d.label, cote: Math.round(cote*20)/20 };
    });
  }
  function optLabel(dossier, code){
    var found=(dossier.candidates||[]).filter(function(o){return o.code===code;})[0];

    var found=(dossier.candidates||[]).filter(function(o){return o.code===code;})[0];
    return found? found.cote : 1;
  }

  function drawCard(){
    var total = 0, byRarity = {};
    Object.keys(RARITY_META).forEach(function(r){ total += RARITY_META[r].weight; });
    var roll = Math.random()*total, acc=0, chosenRarity="COMMUN";
    var order = ["MYTHIQUE","LEGENDAIRE","EPIQUE","RARE","COMMUN"];
    for(var i=0;i<order.length;i++){
      acc += RARITY_META[order[i]].weight;
      if(roll<=acc){ chosenRarity = order[i]; break; }
    }
    var pool = CARD_POOL.filter(function(c){return c.rarity===chosenRarity;});
    return pool[Math.floor(Math.random()*pool.length)];
  }

  /* ---------------- fhir client : vraies routes REST FHIR de la doc du TP ----------------
     GET    /api/{resource}/{id}      → lire une ressource
     GET    /api/{resource}           → lister toutes les ressources
     GET    /api/{resource}?filtre    → lister filtré (ex. subject.reference=Patient/{id})
     POST   /api/{resource}           → créer (body = ressource FHIR)
     PUT    /api/{resource}/{id}      → modifier (body = ressource modifiée)
     DELETE /api/{resource}/{id}      → supprimer
     Content-Type: application/json sur toutes les requêtes.
     MOCK_MODE=true (valeur par défaut de cet artifact publié) simule les réponses côté
     client car le bac à sable Claude bloque les appels réseau vers un hôte externe
     arbitraire. En clonant ce dépôt et en lançant `node serve.js` en local (ou tout
     autre serveur), passez MOCK_MODE=false pour taper directement sur FHIR_BASE avec
     vos identifiants FHIR de boarding list. ---------------------------------------- */
  var fhirLog = [];
  function logFhir(method, path, body, response, error){
    fhirLog.push({method:method, path:path, body:body, response:response, error:error, t:new Date()});
    if(fhirLog.length>60) fhirLog.shift();
    renderFhirLog();
  }
  function mockDelay(){ return 260+Math.random()*260; }

  function realRequest(method, path, body){
    var url = FHIR_BASE + path;
    return fetch(url, {
      method: method,
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){
      return r.json().catch(function(){ return null; }).then(function(json){
        logFhir(method, path, body, json);
        return json;
      });
    }).catch(function(err){
      logFhir(method, path, body, null, err.message);
      throw err;
    });
  }
  function mockRequest(method, path, body, mockResponse){
    return new Promise(function(res){ setTimeout(function(){
      logFhir(method, path, body, mockResponse);
      res(mockResponse);
    }, mockDelay()); });
  }
  function request(method, path, body, mockResponse){
    return MOCK_MODE ? mockRequest(method, path, body, mockResponse) : realRequest(method, path, body);
  }

  function newId(prefix){ return prefix+"-"+Math.random().toString(36).slice(2,10); }

  var fhirClient = {
    /* GET /api/patient/{id} */
    getPatient: function(id, knownName){
      var mock = { resourceType:"Patient", id:id,
        name:[{ use:"official", text:knownName||id, family:knownName?knownName.split(" ").slice(-1)[0]:undefined, given:knownName?[knownName.split(" ")[0]]:undefined }] };
      return request("GET", "/api/patient/"+id, null, mock);
    },
    /* POST /api/patient */
    createPatient: function(patientResource){
      var mock = Object.assign({resourceType:"Patient", id:newId("pat")}, patientResource);
      return request("POST", "/api/patient", patientResource, mock);
    },
    /* GET /api/practitioner/{id} */
    getPractitioner: function(id, name){
      var mock = { resourceType:"Practitioner", id:id, name:[{ use:"official", text:name||"Dr "+id }] };
      return request("GET", "/api/practitioner/"+id, null, mock);
    },
    /* POST /api/observation : le diagnostic officiel du médecin */
    createObservation: function(obsResource){
      var mock = Object.assign({resourceType:"Observation", id:newId("obs"), status:"final"}, obsResource);
      return request("POST", "/api/observation", obsResource, mock);
    },
    /* GET /api/observation?subject.reference=Patient/{id} */
    /* Le serveur du TP répond avec un tableau JSON brut de ressources (vérifié en direct),
       pas un Bundle FHIR encapsulé — le mock imite donc ce même format plat. */
    getObservationsForPatient: function(patientId){
      var mock = [];
      return request("GET", "/api/observation?subject.reference=Patient/"+patientId, null, mock);
    },
    /* PUT /api/observation/{id} */
    updateObservation: function(id, obsResource){
      var mock = Object.assign({resourceType:"Observation", id:id}, obsResource);
      return request("PUT", "/api/observation/"+id, obsResource, mock);
    },
    /* DELETE /api/observation/{id} */
    deleteObservation: function(id){
      return request("DELETE", "/api/observation/"+id, null, { deleted:true, id:id });
    },
    /* POST /api/appointment : rendez-vous de suivi (Step 3 du TP) */
    createAppointment: function(apptResource){
      var mock = Object.assign({resourceType:"Appointment", id:newId("appt"), status:"booked"}, apptResource);
      return request("POST", "/api/appointment", apptResource, mock);
    },
    /* GET /api/appointment/{id} */
    getAppointment: function(id){
      var mock = { resourceType:"Appointment", id:id, status:"booked" };
      return request("GET", "/api/appointment/"+id, null, mock);
    }
  };

  /* Construit une ressource Observation FHIR R4 conforme à partir d'un diagnostic MediBet. */
  function buildObservationResource(dossier, diagCode, diagLabel, medecinName){
    var practitionerId = PRACTITIONER_IDS[medecinName];
    var performer = practitionerId ? { reference:"Practitioner/"+practitionerId, display:medecinName } : { display:medecinName };
    return {
      resourceType: "Observation",
      status: "final",
      code: { coding:[{ system:"http://medibet.local/diagnostics", code:diagCode, display:diagLabel }], text:diagLabel },
      subject: { reference: "Patient/"+dossier.patient.id },
      effectiveDateTime: new Date().toISOString(),
      performer: [performer],
      valueCodeableConcept: { text: diagLabel }
    };
  }
  /* Construit une ressource Appointment FHIR R4 conforme (rendez-vous de suivi). */
  function buildAppointmentResource(dossier){
    var start = new Date(Date.now()+7*864e5);
    var end = new Date(start.getTime()+30*60000);
    return {
      resourceType: "Appointment",
      status: "booked",
      description: "Consultation de suivi",
      start: start.toISOString(),
      end: end.toISOString(),
      participant: [{ actor:{ reference:"Patient/"+dossier.patient.id }, status:"accepted" }]
    };
  }

  /* Un vrai Patient FHIR est créé une seule fois par joueur (POST /api/patient),
     puis son id est réutilisé (cache localStorage) pour toutes ses fiches suivantes. */
  function ensurePatientFhirId(name){
    var key = "medibet_patient_fhir_id_"+slug(name);
    var cached = null;
    try{ cached = localStorage.getItem(key); }catch(e){}
    if(cached) return Promise.resolve(cached);
    return fhirClient.createPatient({
      resourceType:"Patient",
      name:[{ use:"official", text:name, family:name.split(" ").slice(-1)[0], given:[name.split(" ")[0]] }]
    }).then(function(res){
      var id = res.id;
      try{ localStorage.setItem(key, id); }catch(e){}
      return id;
    });
  }

  var actx = null;
  function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  function tone(freq, start, dur, type, gain){
    var c = ac(); if(!c) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type||"sine"; o.frequency.setValueAtTime(freq, c.currentTime+start);
    g.gain.setValueAtTime(0, c.currentTime+start);
    g.gain.linearRampToValueAtTime(gain||.06, c.currentTime+start+.01);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+start+dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime+start); o.stop(c.currentTime+start+dur+.02);
  }

  function confettiBurst(rootEl, colors){
    var n = 46;
    for(var i=0;i<n;i++){
      var s = document.createElement("div");
      var c = colors[Math.floor(Math.random()*colors.length)];
      var dx = (Math.random()-.5)*520, dy = 260+Math.random()*260, rot=(Math.random()-.5)*720;
      s.style.cssText = "position:fixed;left:50%;top:38%;width:8px;height:12px;background:"+c+";z-index:120;pointer-events:none;border-radius:2px;";
      s.style.transition = "transform 1.1s cubic-bezier(.2,.7,.3,1), opacity 1.1s ease";
      rootEl.appendChild(s);
      requestAnimationFrame(function(el,dx,dy,rot){ return function(){
        el.style.transform = "translate("+dx+"px,"+dy+"px) rotate("+rot+"deg)";
        el.style.opacity = "0";
      };}(s,dx,dy,rot));
      setTimeout(function(el){ el.remove(); }, 1300, s);

  function ensureMedecinDoc(name){
    if(!db) return Promise.resolve();
    var id = slug(name);

      if(!snap.exists){
        return db.doc("medecins/"+id).set({ name:name, cards:[], diagCount:0, createdAt:Date.now() });

  function placeBet(dossierId, pronosticCode, cote, name, montant, role){
    if(!db) return Promise.resolve();
    var ref = db.doc("paris/"+dossierId);
    return ref.get().then(function(snap){
      var data = snap.exists ? snap.data() : { dossierId:dossierId, pronostic:pronosticCode, cote:cote, mises:[], status:"ouvert" };
      data.mises = (data.mises||[]).concat([{ name:name, montant:montant, role:role, t:Date.now() }]);
      return ref.set(data);
    });

  function resolveDossier(dossierId, diagnosticCode, medecinName){
    if(!db) return Promise.resolve();
    var dossierRef = db.doc("dossiers/"+dossierId);
    var pariRef = db.doc("paris/"+dossierId);
    return pariRef.get().then(function(snap){
      var pari = snap.exists ? snap.data() : null;
      var won = pari && pari.pronostic === diagnosticCode;
      return dossierRef.update({
        status:"resolu", diagnostic:diagnosticCode, medecin:medecinName,
        resolvedAt:Date.now(), gagnant: !!won
      }).then(function(){
        if(pari){
          return pariRef.set(Object.assign({}, pari, { status: won?"gagne":"perdu" }));
        }
      });
    });
  }

  /* Crée un nouveau dossier à partir des symptômes auto-déclarés par le patient. */
  function createDossier(patientName, patientFhirId, symptomIds){
    if(!db) return Promise.resolve(null);
    var id = "dossier-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,6);
    var data = {
      patientName: patientName,
      patientFhirId: patientFhirId,
      symptoms: symptomIds,
      candidates: computeProbableDiagnoses(symptomIds),
      status: "attente",
      createdAt: Date.now()
    };
    return db.doc("dossiers/"+id).set(data).then(function(){ return id; });
  }

  /* Normalise un doc "dossiers/{id}" tel que stocké en base vers la forme utilisée
     par l'affichage et par les constructeurs de ressources FHIR. */
  function dossierView(id){
    var raw = live.dossiers[id];
    if(!raw) return null;
    return {
      id:id,
      patient: { id: raw.patientFhirId, name: raw.patientName },
      symptoms: raw.symptoms||[],
      candidates: raw.candidates||[],
      options: raw.candidates||[],
      status: raw.status||"attente",
      diagnostic: raw.diagnostic,
      medecin: raw.medecin,
      createdAt: raw.createdAt||0,
      resolvedAt: raw.resolvedAt
    };
  }
  function allDossiers(){
    return Object.keys(live.dossiers).map(dossierView).filter(Boolean);
  }

  function awardBooster(medecinName, cards){
    if(!db) return Promise.resolve();
    var id = slug(medecinName);
    var ref = db.doc("medecins/"+id);
    return ref.get().then(function(snap){
      var data = snap.exists? snap.data() : {name:medecinName, cards:[], diagCount:0};
      var owned = data.cards||[];
      cards.forEach(function(c){
        var found = owned.filter(function(o){return o.id===c.id;})[0];
        if(found) found.count = (found.count||1)+1;
        else owned.push({id:c.id, count:1});
      });
      data.cards = owned;
      data.diagCount = (data.diagCount||0)+1;
      return ref.set(data);
    });
  }

  function proposeTrade(from, offerCardId, wantCardId){
    if(!db) return Promise.resolve();
    return db.collection("trades").add({ from:from, offerCardId:offerCardId, wantCardId:wantCardId, status:"ouvert", t:Date.now() });
  }
  function acceptTrade(trade, byName){
    if(!db) return Promise.resolve();
    var fromRef = db.doc("medecins/"+slug(trade.from));
    var toRef = db.doc("medecins/"+slug(byName));
    return Promise.all([fromRef.get(), toRef.get()]).then(function(results){
      var fromData = results[0].data(), toData = results[1].data();
      function removeOne(list, cardId){
        var f = list.filter(function(c){return c.id===cardId;})[0];
        if(f){ f.count--; }
        return list.filter(function(c){return c.count>0;});
      }
      function addOne(list, cardId){
        var f = list.filter(function(c){return c.id===cardId;})[0];
        if(f) f.count = (f.count||1)+1; else list.push({id:cardId, count:1});
        return list;
      }
      fromData.cards = addOne(removeOne(fromData.cards||[], trade.offerCardId), trade.wantCardId);
      toData.cards = addOne(removeOne(toData.cards||[], trade.wantCardId), trade.offerCardId);
      return Promise.all([
        fromRef.set(fromData), toRef.set(toData),
        db.doc("trades/"+trade._id).set(Object.assign({}, trade, {status:"accepte"}))
      ]);
    });
  }

  /* Interroge le vrai serveur FHIR pour trouver l'Observation posée par le médecin sur ce
     patient. C'est ce chemin qui permet à l'app Patient de résoudre le pari même si elle
     tourne sur un autre ordinateur que l'app Médecin, sans aucun état partagé côté Claude. */
  function checkFhirForDiagnosis(dossier){
    return fhirClient.getObservationsForPatient(dossier.patient.id).then(function(response){
      var list = Array.isArray(response) ? response : ((response && response.entry) || []).map(function(e){ return e.resource||e; });
      var obs = list.filter(function(r){ return r && r.resourceType==="Observation"; })
        .sort(function(a,b){
          var da = new Date(a.effectiveDateTime || (a.effectivePeriod && a.effectivePeriod.start) || 0);
          var db = new Date(b.effectiveDateTime || (b.effectivePeriod && b.effectivePeriod.start) || 0);
          return db-da;
        })[0];
      if(!obs) return null;
      var coding = (obs.code && obs.code.coding && obs.code.coding[0]) || {};
      var codeFromServer = coding.code;
      var textFromServer = (obs.code && obs.code.text) || coding.display || "";
      var matchId = DISEASE_BY_ID[codeFromServer] ? codeFromServer :
        (DISEASES.filter(function(x){ return x.label.toLowerCase()===String(textFromServer).toLowerCase(); })[0]||{}).id;
      if(!matchId) return null;
      var medecinName = (obs.performer && obs.performer[0] && obs.performer[0].display) || "—";
      return { diagnostic: matchId, medecin: medecinName };
    });
  }

    var rows = all.map(function(m){
      var total = (m.cards||[]).reduce(function(s,c){return s+c.count;},0);
      var rare = (m.cards||[]).filter(function(c){ var meta=CARD_POOL.filter(function(x){return x.id===c.id;})[0]; return meta && (meta.rarity==="LEGENDAIRE"||meta.rarity==="MYTHIQUE"); }).length;

      '<button class="btn btn-sm" data-view="'+esc(m.name)+'">Voir</button></div></div>';
    }).join("") || '<div class="empty">Aucun médecin n\'a encore posé de diagnostic.</div>';
    var viewed = state.viewingColleague ? viewColleagueDetail(state.viewingColleague) : "";
    return (
      '<div class="section-head"><h1>Classement des collègues</h1><button class="btn btn-sm" id="btnBack">← Retour</button></div>'+
      '<div class="card">'+rows+'</div>'+
      viewed
    );
  }
  function viewColleagueDetail(name){
    var m = live.medecins[slug(name)]; if(!m) return "";
    var ownedMap = {}; (m.cards||[]).forEach(function(c){ ownedMap[c.id]=c.count; });
    return '<div class="section-head"><h2>Collection de '+esc(name)+'</h2></div><div class="grid grid-3">'+
      CARD_POOL.map(function(c){ return cardTile(c.id, ownedMap[c.id]||0); }).join("")+'</div>';
  }

  /* ---------------- TRADES ---------------- */
  function viewTrades(){
    var mine = live.medecins[slug(state.name)] || {cards:[]};
    var myCards = (mine.cards||[]).filter(function(c){return c.count>0;});
    var openTrades = Object.keys(live.trades).map(function(k){ var t=live.trades[k]; t._id=k; return t; })
      .filter(function(t){ return t.status==="ouvert"; });
    var cardOpts = function(list){ return list.map(function(c){ var meta=CARD_POOL.filter(function(x){return x.id===c.id;})[0]; return '<option value="'+c.id+'">'+esc(meta?meta.name:c.id)+'</option>'; }).join(""); };
    return (
      '<div class="section-head"><h1>Échanges entre collègues</h1><button class="btn btn-sm" id="btnBack">← Retour</button></div>'+
      '<div class="card">'+
        '<h3>Proposer un échange</h3>'+
        (myCards.length ? '<div class="btn-row" style="margin-top:10px;">'+
          '<select id="selOffer">'+cardOpts(myCards)+'</select>'+
          '<span class="muted">contre</span>'+
          '<select id="selWant">'+cardOpts(CARD_POOL)+'</select>'+
          '<button class="btn btn-gold btn-sm" id="btnPropose">Proposer</button>'+
        '</div>' : '<p class="muted">Ouvre des boosters pour avoir des cartes à échanger.</p>')+
      '</div>'+
      '<div class="section-head"><h2>Offres ouvertes</h2></div>'+
      '<div class="card">'+
        (openTrades.length ? openTrades.map(function(t){
          var offerMeta = CARD_POOL.filter(function(c){return c.id===t.offerCardId;})[0];
          var wantMeta = CARD_POOL.filter(function(c){return c.id===t.wantCardId;})[0];
          return '<div class="trade-item"><span><b>'+esc(t.from)+'</b> échange '+offerMeta.emoji+' '+esc(offerMeta.name)+' contre '+wantMeta.emoji+' '+esc(wantMeta.name)+'</span>'+
            (t.from!==state.name ? '<button class="btn btn-sm" data-accept="'+t._id+'">Accepter</button>' : '<span class="faint">en attente</span>')+
          '</div>';
        }).join("") : '<div class="empty">Aucune offre pour le moment.</div>')+
      '</div>'
    );
  }

  /* ---------------- FHIR console ---------------- */
  function renderFhirLog(){
    var box = document.getElementById("fhirLog"); if(!box) return;
    box.innerHTML = fhirLog.slice().reverse().map(function(e){
      return '<div class="l"><span class="m">'+e.method+'</span> <span class="p">'+e.path+'</span><br>'+
        '<span class="r">→ '+esc(JSON.stringify(e.response).slice(0,180))+'</span></div>';
    }).join("") || '<div class="faint">Aucun appel FHIR pour le moment. Interagis avec MediBet pour voir les requêtes.</div>';
  }

  /* ---------------- event delegation ---------------- */
  document.addEventListener("click", function(ev){
    var t = ev.target;

    var roleCardEl = t.closest && t.closest(".role-card");
    if(roleCardEl){
      var role = roleCardEl.getAttribute("data-role");
      sfx.click();
      if(role==="proche"){ setState({screen:"procheJoin", role:"proche"}); return; }
      state.role = role; render();
      return;
    }

    if(t.id==="btnBack"){ sfx.click();
      if(state.role==="medecin") setState({screen:"medecinHome", activeDossier:null});
      else setState({screen:"patientHome", activeDossier:null});
      return;
    }
    if(t.id==="goCollection"){ sfx.click(); setState({screen:"collection"}); return; }
    if(t.id==="goColleagues"){ sfx.click(); setState({screen:"colleagues", viewingColleague:null}); return; }
    if(t.id==="goTrades"){ sfx.click(); setState({screen:"trades"}); return; }

    if(t.id==="btnNewDossier"){
      sfx.click(); setState({screen:"patientCreate", pickedSymptoms:[]}); return;
    }
    if(t.hasAttribute && t.hasAttribute("data-symptom")){
      sfx.click();
      var symId = t.getAttribute("data-symptom");
      var list = (state.pickedSymptoms||[]).slice();
      var idx = list.indexOf(symId);
      if(idx>=0) list.splice(idx,1); else list.push(symId);
      setState({pickedSymptoms:list});
      return;
    }
    if(t.hasAttribute && t.hasAttribute("data-open")){
      sfx.click(); setState({screen:"dossier", activeDossier:t.getAttribute("data-open")}); return;
    }
    if(t.hasAttribute && t.hasAttribute("data-mopen")){
      var dOpen = dossierView(t.getAttribute("data-mopen"));
      sfx.click();
      var myPractId = PRACTITIONER_IDS[state.name];
      fhirClient.getPatient(dOpen.patient.id, dOpen.patient.name);
      if(myPractId) fhirClient.getPractitioner(myPractId, state.name);
      setState({screen:"medecinDossier", activeDossier:t.getAttribute("data-mopen")});
      return;
    }
    if(t.hasAttribute && t.hasAttribute("data-view")){
      setState({viewingColleague:t.getAttribute("data-view")}); return;
    }
    if(t.hasAttribute && t.hasAttribute("data-check")){
      var dCheck = dossierView(t.getAttribute("data-check"));
      t.disabled = true; t.textContent = "Interrogation du serveur FHIR…";
      checkFhirForDiagnosis(dCheck).then(function(found){
        t.disabled = false;
        if(found){
          state.fhirCheck = state.fhirCheck || {};
          state.fhirCheck[dCheck.id] = found;
          sfx.win();
          render();
        } else {
          t.textContent = "Aucun diagnostic pour l'instant, réessayer";
        }
      }).catch(function(){
        t.disabled = false;
        t.textContent = "Serveur FHIR injoignable, réessayer";
      });
      return;
    }
    if(t.hasAttribute && t.hasAttribute("data-appt")){
      var d = dossierView(t.getAttribute("data-appt"));
      sfx.coin();
      fhirClient.getPatient(d.patient.id, d.patient.name).then(function(){
        return fhirClient.createAppointment(buildAppointmentResource(d));
      }).then(function(appt){
        alert("Rendez-vous de suivi confirmé pour le "+new Date(appt.start).toLocaleDateString("fr-FR")+" (Appointment/"+appt.id+")");
      }).catch(function(){
        alert("Impossible de joindre l'API FHIR (voir la console FHIR).");
      });
      return;
    }

    if(t.id==="btnSubmitSymptoms"){
      var symptoms = state.pickedSymptoms||[];
      if(!symptoms.length) return;
      t.disabled = true; t.textContent = "Envoi au serveur FHIR…";
      sfx.place();
      ensurePatientFhirId(state.name).then(function(fhirId){
        return createDossier(state.name, fhirId, symptoms);
      }).then(function(newId){
        if(newId) setState({screen:"dossier", activeDossier:newId, pickedSymptoms:[]});
        else { t.disabled=false; t.textContent="Envoyer au médecin"; }
      }).catch(function(){
        alert("Impossible de joindre l'API FHIR (voir la console FHIR).");
        t.disabled = false; t.textContent = "Envoyer au médecin";
      });
      return;
    }
    if(t.id==="btnMiser"){
      var sel = document.getElementById("selPronostic"), inp = document.getElementById("inpMise");
      var d2 = dossierView(state.activeDossier);
      var code = sel.value, montant = parseInt(inp.value,10)||10;
      sfx.place();
      fhirClient.getPatient(d2.patient.id, d2.patient.name).then(function(){
        return placeBet(d2.id, code, optCote(d2,code), state.name, montant, "patient");
      });
      return;
    }
    if(t.id==="btnRejoindre"){
      var d3 = dossierView(state.activeDossier);
      var inp2 = document.getElementById("inpMiseJoin");
      var pari = live.paris[d3.id];
      sfx.place();
      placeBet(d3.id, pari.pronostic, pari.cote, state.name, parseInt(inp2.value,10)||10, state.role==="proche"?"proche":"patient");
      return;
    }
    if(t.id==="btnJoin"){
      var code2 = document.getElementById("inpCode").value.trim();
      if(live.dossiers[code2]){
        state.role = "proche";
        var procheName = prompt("Ton prénom, pour la mise ?","Proche");
        state.name = procheName || "Proche anonyme";
        setState({screen:"dossier", activeDossier:code2});
      } else alert("Code dossier inconnu.");
      return;
    }

    if(t.id==="btnDiag"){
      var d4 = dossierView(state.activeDossier);
      var diagCode = document.getElementById("selDiag").value;
      sfx.win();
      fhirClient.createObservation(buildObservationResource(d4, diagCode, diseaseLabel(diagCode), state.name)).then(function(){
        return resolveDossier(d4.id, diagCode, state.name);
      }).then(function(){
        var cards = [drawCard(), drawCard(), drawCard()];
        return awardBooster(state.name, []).then(function(){ return cards; });
      }).then(function(cards){
        state.pendingBooster = cards;
        setState({screen:"medecinHome", activeDossier:null});
      }).catch(function(){
        alert("Impossible de joindre l'API FHIR (voir la console FHIR).");
      });
      return;
    }

    if(t.id==="btnOpenPack"){
      openBoosterFlow();
      return;
    }
    if(t.id==="btnPropose"){
      var off = document.getElementById("selOffer").value, want = document.getElementById("selWant").value;
      proposeTrade(state.name, off, want).then(function(){ render(); });
      return;
    }
    if(t.hasAttribute && t.hasAttribute("data-accept")){
      var tid = t.getAttribute("data-accept");
      var trade = live.trades[tid]; trade._id = tid;
      acceptTrade(trade, state.name).then(function(){ sfx.win(); render(); });
      return;
    }
  });

  function openBoosterFlow(){
    var mine = live.medecins[slug(state.name)] || {cards:[]};
    var pending = (mine.diagCount||0) - (mine.boostersOpened||0);
    if(pending<=0) return;
    var cards = state.pendingBooster || [drawCard(), drawCard(), drawCard()];
    state.pendingBooster = null;
    sfx.pack();
    var overlay = el('<div class="reveal-overlay"><h2>Booster maladie</h2><div class="reveal-cards"></div><button class="btn btn-gold" id="btnCloseReveal">Encaisser</button></div>');
    document.getElementById("overlayRoot").appendChild(overlay);
    var wrap = overlay.querySelector(".reveal-cards");
    cards.forEach(function(c, i){
      setTimeout(function(){
        var isMythique = c.rarity==="MYTHIQUE";
        var tile = el('<div class="reveal-card rarity-'+c.rarity+'"><span class="emoji">'+c.emoji+'</span><div class="name">'+esc(c.name)+'</div><div class="rarity">'+RARITY_META[c.rarity].label+'</div></div>');
        wrap.appendChild(tile);
        if(isMythique){ sfx.legendary(); confettiBurst(document.body, ["#ffb400","#ff4d5e","#b98bff","#34e2a1"]); }
      }, i*380);
    });
    overlay.querySelector("#btnCloseReveal").onclick = function(){
      overlay.remove();
      var id = slug(state.name);
      db.doc("medecins/"+id).get().then(function(snap){
        var data = snap.data();
        data.boostersOpened = (data.boostersOpened||0)+1;
        var owned = data.cards||[];
        cards.forEach(function(c){
          var found = owned.filter(function(o){return o.id===c.id;})[0];
          if(found) found.count = (found.count||1)+1; else owned.push({id:c.id,count:1});
        });
        data.cards = owned;
        db.doc("medecins/"+id).set(data);
      });
    };
  }

  document.addEventListener("keydown", function(){});

  document.getElementById("fhirConsoleTitle").textContent = "// api.alliance4u.io · flux FHIR"+(MOCK_MODE?" (simulé)":" (réel)");

  document.getElementById("fhirToggle").onclick = function(){
    document.getElementById("fhirConsole").classList.toggle("open");
  };
  document.getElementById("fhirClose").onclick = function(){
    document.getElementById("fhirConsole").classList.remove("open");
  };

  /* ---------------- name selection wiring (delegated, role already chosen) ---------------- */
  document.addEventListener("click", function(ev){
    var t = ev.target;
    if(t.classList && t.classList.contains("name-chip")){
      var nm = t.getAttribute("data-name");
      state.name = nm;
      sfx.click();
      if(state.role==="medecin"){
        ensureMedecinDoc(nm).then(function(){ setState({screen:"medecinHome"}); });
      } else {
        setState({screen:"patientHome"});
      }
    }
  });

  /* re-render role picker to include roster once a role is chosen but no name yet */
  var _origRender = render;
  render = function(){
    _origRender();
    if(state.role && !state.name && (state.screen==="landing")){
      var app = document.getElementById("app");
      var roster = TEAMS[state.role].members.map(function(m){ return '<button class="name-chip" data-name="'+esc(m)+'">'+esc(m)+'</button>'; }).join("");
      app.querySelector("main").innerHTML =
        '<div class="landing"><h2>'+TEAMS[state.role].label+'</h2><p class="sub">Qui es-tu ?</p><div class="roster">'+roster+'</div>'+
        '<button class="btn btn-ghost btn-sm" style="margin-top:20px;" id="btnCancelRole">← Changer de rôle</button></div>';
      var cancel = document.getElementById("btnCancelRole");
      if(cancel) cancel.onclick = function(){ setState({role:null}); };
    }
  };

  /* ---------------- db bootstrap ---------------- */
  function subscribe(){
    db.collection("dossiers").onSnapshot(function(snap){
      snap.docs.forEach(function(doc){ live.dossiers[doc.id] = doc.data(); });
      render();
    }, function(){});
    db.collection("paris").onSnapshot(function(snap){
      live.paris = {};
      snap.docs.forEach(function(doc){ live.paris[doc.id] = doc.data(); });
      render();
    }, function(){});
    db.collection("medecins").onSnapshot(function(snap){
      live.medecins = {};
      snap.docs.forEach(function(doc){ live.medecins[doc.id] = doc.data(); });
      render();
    }, function(){});
    db.collection("trades").onSnapshot(function(snap){
      live.trades = {};
      snap.docs.forEach(function(doc){ live.trades[doc.id] = doc.data(); });
      render();
    }, function(){});
  }

  render();

  if(window.claude && window.claude.use){
    window.claude.use("db").then(function(d){
      db = d;
      if(db){ dbReady = true; subscribe(); }
      else { render(); }
    });
  }

})();
</script>
